<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132f57"><title>Acceso de alumnos</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#182033;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:620px;margin:auto;padding:20px}.hero{background:#132f57;color:#fff;padding:28px;border-radius:20px;margin-top:24px}.card{background:#fff;border:1px solid #dfe4eb;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 5px 18px #0000000a}.status{padding:12px;border-radius:12px;background:#eef3f8}.bad{background:#fde8ea;color:#8b1d2a}.primary{display:inline-block;background:#132f57;color:#fff;text-decoration:none;border-radius:12px;padding:12px 16px;font-weight:900}.meta{opacity:.72}</style></head><body><div class="wrap"><div class="hero"><h1 id="title">Acceso de alumnos</h1><p id="desc">Consultando actividad disponible…</p></div><div class="card"><div id="state" class="status">Cargando…</div><p id="meta" class="meta"></p><a id="go" class="primary" href="#" style="display:none">Ingresar</a></div></div>
<script>
const SUPA='https://xqeyyjakmeiaahecfdmc.supabase.co',KEY='sb_publishable_GY2NGAigumnZw3rIJKU7LA_a2qigAEA';
(async()=>{const st=document.getElementById('state'),go=document.getElementById('go');try{const r=await fetch(SUPA+'/rest/v1/rpc/public_student_entry',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:'{}'});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=null}if(!r.ok||!d)throw Error('No se pudo consultar el acceso.');
document.getElementById('title').textContent=d.title||'Acceso de alumnos';document.getElementById('desc').textContent=d.description||'';
if(!d.active||!d.target_path){st.className='status bad';st.textContent='No hay una actividad disponible en este momento.';return}
st.textContent='Actividad disponible: '+(d.target_label||'Actividad');go.href='../'+String(d.target_path).replace(/^\/+|\.\.\//g,'');go.style.display='inline-block';go.textContent='Ingresar a '+(d.target_label||'la actividad');
}catch(e){st.className='status bad';st.textContent=e.message||String(e)}})();
</script></body></html>
