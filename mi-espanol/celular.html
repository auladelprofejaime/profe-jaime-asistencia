<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Uso de celular · App Estudiantes</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f6f4ee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.back{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;box-shadow:0 2px 10px #0001}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0000000d}.status{padding:12px;border-radius:14px;background:#f1f1f1}.incident{border-top:1px solid #eee;padding:14px 0}.incident:first-child{border-top:0}.incident b{display:block}.incident small{display:block;color:#666;margin-top:4px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:.8rem;font-weight:800;margin-top:6px}.first{background:#eef6ff;color:#205782}.second{background:#fff2cc;color:#775b00}.third{background:#fde1de;color:#8f2f2a}.empty{text-align:center;color:#777;padding:20px}h2{margin:0}.rule{background:#fff6cf;border:1px solid #ead275;border-radius:14px;padding:14px;line-height:1.45}
</style></head><body><div class="wrap"><div class="top"><button class="back" onclick="location.href='./'">← App Estudiantes</button><div><h2>Uso de celular</h2><small>Historial individual</small></div></div>
<div class="rule">Este apartado muestra las incidencias registradas por uso del teléfono celular durante la jornada escolar.</div>
<div class="card"><div id="state" class="status">Cargando historial…</div><div id="history"></div></div></div>
<script>
const SUPABASE_URL='https://xqeyyjakmeiaahecfdmc.supabase.co';
const API_KEY='sb_publishable_GY2NGAigumnZw3rIJKU7LA_a2qigAEA';
function collectTokens(){
 const out=[];
 function walk(v,d=0){if(d>4||v==null)return;if(typeof v==='string'){if(v.length>=16)out.push(v);return}if(Array.isArray(v))return v.forEach(x=>walk(x,d+1));if(typeof v==='object'){for(const [k,x] of Object.entries(v)){if(/token/i.test(k)&&typeof x==='string')out.unshift(x);else walk(x,d+1)}}}
 for(const st of [localStorage,sessionStorage]){for(let i=0;i<st.length;i++){const k=st.key(i);const raw=st.getItem(k);if(!raw)continue;try{walk(JSON.parse(raw))}catch(_){if(/token|session|portal/i.test(k||''))out.push(raw)}}}
 return [...new Set(out)];
}
async function rpc(token){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/portal_cellphone_history`,{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY,'Authorization':`Bearer ${API_KEY}`},body:JSON.stringify({p_token:token})});if(!r.ok)return null;return r.json()}
function label(n){return n===1?'Primera incidencia':n===2?'Segunda incidencia':n===3?'Tercera incidencia · Seguimiento con familia':`${n}.ª incidencia · Seguimiento con familia`}
(async()=>{const state=document.querySelector('#state'),box=document.querySelector('#history');let out=null;for(const t of collectTokens()){try{const x=await rpc(t);if(x?.ok){out=x;break}}catch(_){}}if(!out){state.textContent='No fue posible recuperar la sesión. Regresa a la app, inicia sesión nuevamente y vuelve a abrir este apartado.';return}state.textContent=`${out.count||0} incidencia${Number(out.count||0)===1?'':'s'} registrada${Number(out.count||0)===1?'':'s'}.`;const rows=out.incidents||[];box.innerHTML=rows.length?rows.map(x=>{const n=Number(x.incident_number),d=new Date(x.incident_at),cls=n===1?'first':n===2?'second':'third';return `<div class="incident"><b>${label(n)}</b><small>${d.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}</small><span class="tag ${cls}">${n===1?'Aviso':n===2?'Reporte':'Seguimiento con familia'}</span>${x.notes?`<p>${String(x.notes).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</p>`:''}</div>`}).join(''):'<div class="empty">No hay incidencias registradas.</div>'})();
</script></body></html>
