<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132f57"><title>Evaluación de poemas</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#182033;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:#132f57;color:#fff;padding:24px;border-radius:20px;margin-bottom:16px}.hero h1{margin:0 0 6px}.card{background:#fff;border:1px solid #dfe4eb;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0000000a}label{display:block;font-weight:800;margin:12px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #b9c2ce;border-radius:12px;background:#fff}button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:#132f57;color:#fff}.secondary{background:#edf1f6;color:#132f57}.hidden{display:none!important}.status{padding:10px 12px;border-radius:12px;background:#eef3f8;margin:10px 0}.bad{background:#fde8ea;color:#8b1d2a}.good{background:#e7f6ec;color:#176b35}.rubric{display:grid;gap:12px}.criterion{border:1px solid #dfe4eb;border-radius:14px;padding:12px}.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.scale label{margin:0;padding:9px;border:1px solid #ccd3dd;border-radius:10px;text-align:center;font-weight:800}.scale input{width:auto}.presenter{border:1px solid #dfe4eb;border-radius:14px;padding:12px;margin:9px 0}.presenter.done{background:#eef9f1}.reason-grid{display:grid;gap:7px}.reason-grid label{font-weight:600;margin:0;padding:8px;border:1px solid #dfe4eb;border-radius:10px}.reason-grid input{width:auto;margin-right:7px}.meta{font-size:.9rem;opacity:.75}.demo{background:#fff4c5;color:#6d5100;padding:10px;border-radius:12px;font-weight:800}@media(max-width:520px){.scale{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap">
<div class="hero"><h1>Evaluación de presentaciones de poemas</h1><p>Secundaria vespertina · El Aula del Profe Jaime</p></div>
<div id="loginCard" class="card"><h2>Ingresa tu matrícula</h2><p>Usa tu matrícula escolar. El sistema identificará tu nombre y grupo.</p><label>Matrícula<input id="matricula" inputmode="numeric" autocomplete="off" placeholder="Ej. 243403"></label><button id="enter" class="primary">Continuar</button><p id="loginStatus" class="status hidden"></p></div>
<div id="app" class="hidden"><div class="card"><div id="demo" class="demo hidden">Modo demostración: puedes explorar el formulario, pero no se guardará ninguna respuesta.</div><h2 id="studentName"></h2><p id="studentMeta" class="meta"></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="backTeacherApp" class="secondary" type="button">Volver a App Docente</button><button id="logout" class="secondary" type="button">Salir / cambiar matrícula</button></div></div><div id="sessions"></div></div>
</div>
<script>
const SUPA='https://xqeyyjakmeiaahecfdmc.supabase.co',KEY='sb_publishable_GY2NGAigumnZw3rIJKU7LA_a2qigAEA';
const q=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ctx=null,mat='';
async function rpc(fn,args){const r=await fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(d?.message||d?.hint||t||'No se pudo consultar');return d}
const criteria=[['dominio','Dominio del poema'],['expresion','Expresión oral'],['interpretacion','Interpretación'],['postura','Postura y lenguaje corporal'],['estilo','Originalidad y estilo']];
const reasonOptions=['Mostró dominio del poema','Se escuchó claramente','Utilizó buena dicción','Manejó adecuadamente el ritmo y las pausas','Transmitió la emoción o intención del poema','Mostró seguridad','Su expresión corporal apoyó la presentación','Mostró un estilo propio','Necesitó mayor volumen','Necesitó mejorar la claridad al hablar','Podría mejorar ritmo y pausas','Faltó mayor expresión o interpretación','Mostró inseguridad','Perdió continuidad o dominio del poema','Su postura o movimientos podrían mejorar'];
function rubricHtml(prefix,self=false){const desc=self?{dominio:['Perdí frecuentemente la continuidad','Tuve varios errores o titubeos','Tuve uno o dos errores menores','Dominé el poema con seguridad'],expresion:['Mi forma de hablar dificultó la presentación','Tuve dificultades con volumen, ritmo o pausas','En general me escuché bien','Hablé con claridad, buen volumen, ritmo y pausas'],interpretacion:['Me concentré solo en decir el texto','Mi interpretación fue limitada','Transmití buena parte de la intención','Transmití claramente emociones y sentido'],postura:['Mi postura afectó la presentación','Me sentí rígido','Mantuve buena postura','Postura, gestos y movimientos apoyaron la presentación'],estilo:['Mi presentación fue mecánica','Tuve poco estilo propio','Mostré algunos elementos personales','Le di un estilo propio al poema']}:{dominio:['Mostró poco dominio','Tuvo varios errores','Uno o dos errores menores','Dominio seguro y continuo'],expresion:['Difícil de escuchar o seguir','Problemas claros de volumen/ritmo','Se escuchó bien casi siempre','Claridad, volumen, ritmo y pausas adecuados'],interpretacion:['Sin interpretación','Interpretación limitada','Transmitió adecuadamente la intención','Transmitió claramente emoción y sentido'],postura:['La postura dificultó la presentación','Se mostró rígido','Buena postura con expresión limitada','Gestos y postura apoyaron la presentación'],estilo:['Presentación mecánica','Poco estilo propio','Algunos elementos personales','Estilo propio sin perder el sentido']};return '<div class="rubric">'+criteria.map(([k,l])=>'<div class="criterion"><b>'+l+'</b><div class="scale">'+[1,2,3,4].map(n=>'<label><input required type="radio" name="'+prefix+'_'+k+'" value="'+n+'"> '+n+'<small style="display:block;font-weight:500">'+desc[k][n-1]+'</small></label>').join('')+'</div></div>').join('')+'</div>'}
function getRubric(prefix){const out={};for(const [k] of criteria){const el=document.querySelector('input[name="'+prefix+'_'+k+'"]:checked');if(!el)throw Error('Completa todos los criterios');out[k]=Number(el.value)}return out}
function render(){q('loginCard').classList.add('hidden');q('app').classList.remove('hidden');q('studentName').textContent=ctx.student.name;q('studentMeta').textContent='Grupo '+ctx.student.group+' · Matrícula '+ctx.student.matricula;q('demo').classList.toggle('hidden',!ctx.demo);const box=q('sessions');box.innerHTML='';
 const sessions=ctx.sessions||[];for(const s of sessions){const open=s.is_open,eligible=(s.presenters||[]).filter(p=>p.presented&& !p.self),self=(s.presenters||[]).find(p=>p.self&&p.presented);const card=document.createElement('div');card.className='card';card.innerHTML='<h2>'+esc(s.presentation_date)+'</h2><p class="meta">Evaluación disponible hasta '+new Date(s.closes_at).toLocaleString('es-MX')+'</p>'+(!open?'<p class="status bad">Esta evaluación no está abierta en este momento.</p>':'<p class="status good">Evaluación abierta.</p>')+(open?'<p><b>Coevaluaciones:</b> '+s.peer_done+'/'+s.peer_required+'</p>':'')+(open&&eligible.length?'<div>'+eligible.map(p=>'<div class="presenter"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.poem)+'</div><button class="primary peerBtn" data-session="'+esc(s.id)+'" data-id="'+esc(p.student_id)+'" data-name="'+esc(p.name)+'">Evaluar compañero</button></div>').join('')+'</div>':'')+(open&&self?'<div class="presenter"><b>Tu autoevaluación</b><div class="meta">'+esc(self.poem)+'</div><button class="primary selfBtn" data-session="'+esc(s.id)+'" data-id="'+esc(self.student_id)+'">Realizar autoevaluación</button></div>':'');box.appendChild(card)}
 document.querySelectorAll('.peerBtn').forEach(b=>b.onclick=()=>openForm('peer',b.dataset.session,b.dataset.id,b.dataset.name));document.querySelectorAll('.selfBtn').forEach(b=>b.onclick=()=>openForm('self',b.dataset.session,b.dataset.id,ctx.student.name))
}
function openForm(type,session,presenter,name){const wrap=document.createElement('div');wrap.className='card';wrap.id='evalForm';wrap.innerHTML='<h2>'+(type==='self'?'Autoevaluación':'Coevaluación de '+esc(name))+'</h2><p class="meta">Escala: 1 = requiere mucho trabajo · 4 = desempeño destacado.</p>'+rubricHtml('r',type==='self')+(type==='peer'?'<h3>Selecciona las afirmaciones que describen la presentación</h3><div class="reason-grid">'+reasonOptions.map((x,i)=>'<label><input type="checkbox" name="reason" value="'+esc(x)+'"> '+esc(x)+'</label>').join('')+'</div>':'<label>¿Qué consideras que hiciste mejor?<textarea id="best" maxlength="500"></textarea></label><label>¿Qué necesitas mejorar?<textarea id="improve" maxlength="500"></textarea></label>')+'<div style="margin-top:14px;display:flex;gap:8px"><button id="saveEval" class="primary">Guardar evaluación</button><button id="cancelEval" class="secondary">Cancelar</button></div><p id="formStatus" class="status hidden"></p>';q('sessions').prepend(wrap);wrap.scrollIntoView({behavior:'smooth'});q('cancelEval').onclick=()=>wrap.remove();q('saveEval').onclick=async()=>{const st=q('formStatus');try{const rubric=getRubric('r'),reasons=type==='peer'?[...document.querySelectorAll('input[name="reason"]:checked')].map(x=>x.value):[];if(type==='peer'&&!reasons.length)throw Error('Selecciona al menos una justificación');st.className='status';st.classList.remove('hidden');st.textContent='Guardando…';const out=await rpc('public_poem_eval_submit',{p_matricula:mat,p_session_id:session,p_type:type,p_presenter_id:presenter,p_rubric:rubric,p_reasons:reasons,p_best:type==='self'?q('best').value:null,p_improve:type==='self'?q('improve').value:null});st.className='status good';st.textContent=out.demo?'Demostración completa. No se guardaron datos.':'Evaluación guardada.';setTimeout(async()=>{wrap.remove();await loadContext()},700)}catch(e){st.className='status bad';st.classList.remove('hidden');st.textContent=e.message}}}
async function loadContext(){ctx=await rpc('public_poem_eval_context',{p_matricula:mat});render()}
q('enter').onclick=async()=>{const st=q('loginStatus');mat=q('matricula').value.trim();if(!mat)return;st.className='status';st.classList.remove('hidden');st.textContent='Validando…';try{await loadContext()}catch(e){st.className='status bad';st.textContent=e.message}};
q('matricula').addEventListener('keydown',e=>{if(e.key==='Enter')q('enter').click()});q('backTeacherApp').onclick=()=>{location.href='../index.html#poem-contest'};q('logout').onclick=()=>{ctx=null;mat='';q('app').classList.add('hidden');q('loginCard').classList.remove('hidden');q('matricula').value='';q('loginStatus').classList.add('hidden')};
</script></body></html>
